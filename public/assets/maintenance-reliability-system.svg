<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" role="img" aria-labelledby="title desc">
  <title id="title">Connected equipment reliability system</title>
  <desc id="desc">A QR-linked device record connects error, usage, print and maintenance histories. The linked evidence supports pattern review, root-cause analysis and corrective action.</desc>

  <rect width="960" height="840" fill="#dcd5c7"/>

  <text x="48" y="46" fill="#6b665b" font-family="'Courier New', monospace" font-size="20" letter-spacing="3">
    CONNECTED EQUIPMENT RELIABILITY SYSTEM
  </text>

  <g>
    <rect x="48" y="76" width="864" height="138" rx="2" fill="#ece7dd" stroke="#c24a1e" stroke-width="2"/>
    <text x="78" y="112" fill="#c24a1e" font-family="'Courier New', monospace" font-size="20" letter-spacing="2">QR-LINKED ASSET</text>
    <text x="78" y="160" fill="#1b1813" font-family="Georgia, 'Times New Roman', serif" font-size="38">Device record</text>
    <text x="78" y="192" fill="#756e61" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22">One shared equipment identity</text>
  </g>

  <g fill="none" stroke="#c24a1e" stroke-width="2">
    <path d="M480 214V258"/>
    <path d="M255 258H705"/>
    <path d="M255 258V290"/>
    <path d="M705 258V290"/>
    <path d="M480 258V450"/>
    <path d="M255 450H705"/>
    <path d="M255 450V474"/>
    <path d="M705 450V474"/>
  </g>

  <rect x="354" y="239" width="252" height="38" fill="#dcd5c7"/>
  <text x="480" y="264" text-anchor="middle" fill="#756e61" font-family="'Courier New', monospace" font-size="17" letter-spacing="2">
    CONNECTED HISTORIES
  </text>

  <g>
    <rect x="48" y="290" width="414" height="144" rx="2" fill="#ece7dd" stroke="#bdb5a6" stroke-width="2"/>
    <text x="76" y="327" fill="#c24a1e" font-family="'Courier New', monospace" font-size="20" letter-spacing="2">01</text>
    <text x="76" y="372" fill="#1b1813" font-family="Georgia, 'Times New Roman', serif" font-size="34">Error history</text>
    <text x="76" y="408" fill="#756e61" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21">Symptoms · evidence · cause</text>
  </g>

  <g>
    <rect x="498" y="290" width="414" height="144" rx="2" fill="#ece7dd" stroke="#bdb5a6" stroke-width="2"/>
    <text x="526" y="327" fill="#c24a1e" font-family="'Courier New', monospace" font-size="20" letter-spacing="2">02</text>
    <text x="526" y="372" fill="#1b1813" font-family="Georgia, 'Times New Roman', serif" font-size="34">Usage history</text>
    <text x="526" y="408" fill="#756e61" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21">Hours · cycles · operating context</text>
  </g>

  <g>
    <rect x="48" y="474" width="414" height="144" rx="2" fill="#ece7dd" stroke="#bdb5a6" stroke-width="2"/>
    <text x="76" y="511" fill="#c24a1e" font-family="'Courier New', monospace" font-size="20" letter-spacing="2">03</text>
    <text x="76" y="556" fill="#1b1813" font-family="Georgia, 'Times New Roman', serif" font-size="34">Print history</text>
    <text x="76" y="592" fill="#756e61" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21">Runs · outcomes · recurrence</text>
  </g>

  <g>
    <rect x="498" y="474" width="414" height="144" rx="2" fill="#ece7dd" stroke="#bdb5a6" stroke-width="2"/>
    <text x="526" y="511" fill="#c24a1e" font-family="'Courier New', monospace" font-size="20" letter-spacing="2">04</text>
    <text x="526" y="556" fill="#1b1813" font-family="Georgia, 'Times New Roman', serif" font-size="34">Maintenance history</text>
    <text x="526" y="592" fill="#756e61" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21">Tasks · parts · corrective action</text>
  </g>

  <g>
    <path d="M480 618V676" fill="none" stroke="#c24a1e" stroke-width="2"/>
    <rect x="364" y="632" width="232" height="34" fill="#dcd5c7"/>
    <text x="480" y="655" text-anchor="middle" fill="#756e61" font-family="'Courier New', monospace" font-size="17" letter-spacing="2">
      LINKED EVIDENCE
    </text>
  </g>

  <g>
    <rect x="48" y="676" width="864" height="116" rx="2" fill="#ece7dd" stroke="#a9a090" stroke-width="2"/>
    <text x="78" y="716" fill="#c24a1e" font-family="'Courier New', monospace" font-size="19" letter-spacing="2">RCA LOOP</text>
    <text x="78" y="762" fill="#1b1813" font-family="Georgia, 'Times New Roman', serif" font-size="31">
      Pattern review · root cause · corrective action
    </text>
  </g>
</svg>
